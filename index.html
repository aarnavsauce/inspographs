<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inspographs — Random Block</title>
  <style>
    :root {
      --bg: #111111;
      --fg: #eaeaea;
      --muted: #777777;
      --border: #2a2a2a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    main {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }
    img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border: 1px solid var(--border);
    }
    .text-block {
      font-size: 1.15rem;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
      padding: 1.5rem;
      border: 1px solid var(--border);
      width: 100%;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      align-items: center;
    }
    a, button {
      color: var(--fg);
      background: none;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: none;
      cursor: pointer;
    }
    a:hover, button:hover {
      border-color: var(--fg);
    }
  </style>
</head>
<body>
  <main id="stage">
    <p class="meta">Fetching block...</p>
  </main>

  <script>
    const API_URL = "https://api.are.na/v3/channels/inspographs-7q5lmm3p5rm/contents";
    const CACHE_KEY = "arena_total_count_inspographs";
    const stage = document.getElementById("stage");

    async function getTotalCount() {
      const cached = sessionStorage.getItem(CACHE_KEY);
      if (cached && Number(cached) > 0) {
        return Number(cached);
      }

      const metaRes = await fetch(`${API_URL}?per=1&_=${Date.now()}`);
      if (metaRes.status === 429) throw new Error("Rate limited by Are.na — wait ~60s and try again.");
      if (!metaRes.ok) throw new Error(`HTTP ${metaRes.status}`);

      const metaPayload = await metaRes.json();
      const totalCount =
        metaPayload.meta?.total_count ??
        metaPayload.meta?.total_pages ??
        metaPayload.length ??
        0;

      if (totalCount > 0) {
        sessionStorage.setItem(CACHE_KEY, String(totalCount));
      }

      return totalCount;
    }

    async function loadRandomBlock() {
      stage.innerHTML = `<p class="meta">Loading...</p>`;

      try {
        // 1. Read total block count from sessionStorage (or fetch once per tab session)
        const totalCount = await getTotalCount();

        if (!totalCount) {
          stage.innerHTML = `<p class="meta">Channel is empty or private.</p>`;
          return;
        }

        // 2. Pick a uniform random index and fetch that single block
        let block = null;
        for (let attempt = 0; attempt < 5; attempt++) {
          const randomPage = Math.floor(Math.random() * totalCount) + 1;
          const res = await fetch(
            `${API_URL}?per=1&page=${randomPage}&_=${Date.now()}`
          );
          if (res.status === 429) throw new Error("Rate limited by Are.na — wait ~60s and try again.");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const payload = await res.json();

          const items = payload.data ?? payload.contents ?? [];
          const candidate = items[0];
          const blockType = candidate?.type ?? candidate?.class;

          // Skip nested channels so only actual blocks render
          if (candidate && blockType !== "Channel") {
            block = candidate;
            break;
          }
        }

        if (!block) {
          stage.innerHTML = `<p class="meta">Could not find a non-channel block.</p>`;
          return;
        }

        renderBlock(block);
      } catch (err) {
        stage.innerHTML = `
          <p class="meta">${escapeHTML(err.message)}</p>
          <button id="retry">Try Again</button>
        `;
        document.getElementById("retry")?.addEventListener("click", loadRandomBlock);
      }
    }

    function renderBlock(block) {
      let contentHTML = "";
      const blockType = block.type ?? block.class;

      const imgUrl =
        block.image?.large?.src ||
        block.image?.medium?.src ||
        block.image?.src ||
        block.image?.display?.url;

      const textBody =
        typeof block.content === "string"
          ? block.content
          : block.content?.plain || block.content?.markdown || "";

      if (imgUrl) {
        contentHTML = `<img src="${imgUrl}" alt="${escapeHTML(block.title || "Are.na block")}" />`;
      } else if (blockType === "Text" || textBody) {
        contentHTML = `<div class="text-block">${escapeHTML(textBody)}</div>`;
      } else {
        contentHTML = `<div class="text-block">${escapeHTML(block.title || block.source?.url || "Untitled Block")}</div>`;
      }

      const sourceLink = block.source?.url
        ? `<a href="${block.source.url}" target="_blank" rel="noopener">Source ↗</a>`
        : "";

      stage.innerHTML = `
        ${contentHTML}
        <div class="meta">
          <span>${escapeHTML(block.title || blockType || "Block")}</span>
          <a href="https://www.are.na/block/${block.id}" target="_blank" rel="noopener">Are.na ↗</a>
          ${sourceLink}
          <button id="reroll">Shuffle</button>
        </div>
      `;

      document.getElementById("reroll").addEventListener("click", loadRandomBlock);
    }

    function escapeHTML(str = "") {
      return String(str).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    loadRandomBlock();
  </script>
</body>
</html>
